# flasher.cometmesh.org -> 301 to the home page (a browser installer comes back
# with the first release). cometmesh.org + www: the home page.
#
# TLS and the http->https redirect come from certbot (deploy/README.md), which
# edits the live copy of this file on the box.

server {
    listen 80;
    listen [::]:80;
    server_name flasher.cometmesh.org;
    # The install experience is the guided journey at cometmesh.org (choose
    # Standalone vs Launcher). flasher.* is kept as an alias that lands there.
    return 301 https://cometmesh.org$request_uri;
}

# Bare domain + www: the home page with the roadmap (deploy/site/, published by
# scripts/deploy-site.sh).
server {
    listen 80;
    listen [::]:80;
    server_name cometmesh.org www.cometmesh.org;

    root /srv/comet/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.(css|js|svg|ico|jpg)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ \.json$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }
}
