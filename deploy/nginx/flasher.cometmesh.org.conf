# flasher.cometmesh.org — browser (Web Serial) install page.
# cometmesh.org + www  ->  redirect to the flasher (the bare domain's landing).
#
# Cloudflare fronts these; SSL "Flexible" => CF<->origin is HTTP, so listen 80.
# The page self-upgrades http->https in JS (Web Serial needs a secure context),
# since zone-wide "Always Use HTTPS" is off for the firmware's sake.

server {
    listen 80;
    listen [::]:80;
    server_name flasher.cometmesh.org;
    # The install experience is the guided journey at cometmesh.org (choose
    # Standalone vs Launcher). flasher.* is kept as an alias that lands there.
    return 301 https://cometmesh.org$request_uri;
}

# Bare domain + www -> the guided landing page (deploy/site/). Activate by pointing
# the cometmesh.org A record at the VPS in Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name cometmesh.org www.cometmesh.org;

    root /srv/comet/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.json$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }
}
