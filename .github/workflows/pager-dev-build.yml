name: pager-dev-build

# Development build for the T-LoRa Pager hardware work on this fork.
# Every push to a pager-* branch builds both Pager radio variants (plus a few
# other boards that share the touched UI code, as a regression check) and
# attaches the flashable images as workflow artifacts.
#
# Not meant for upstream: drop this file before opening the PR.

on:
  push:
    branches: ['pager-*', 'max-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - tlora_pager_sx1262_companion_radio_touch
          - tlora_pager_lr1121_companion_radio_touch
          - LilyGo_TDeck_companion_radio_touch
          - ThinkNode_M9_companion_radio_touch
          - LilyGo_TDeck_Max_companion_radio_touch
          - heltec_v4_tft_companion_radio_usb_tcp_touch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-dev-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-dev-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: |
          unset WIFI_SSID WIFI_PWD
          TAG="dev-${GITHUB_SHA::7}"
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_RELEASE_TAG='\"${TAG}\"' -DFIRMWARE_VERSION='\"wadamesh ${TAG}\"'"
          pio run -t mergebin -e "${{ matrix.env }}" 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Internal RAM symbols (TEST ONLY)
        if: success() && startsWith(matrix.env, 'LilyGo_TDeck_Max')
        run: |
          TC=$(ls -d ~/.platformio/packages/toolchain-xtensa-esp32s3/bin)
          ELF=.pio/build/${{ matrix.env }}/firmware.elf
          echo "== section sizes"; $TC/xtensa-esp32s3-elf-size -A $ELF | grep -E 'dram|iram|bss|data|noinit|ext_ram'
          echo "== top internal DRAM symbols (.dram0.bss / .dram0.data)"
          $TC/xtensa-esp32s3-elf-objdump -t -C $ELF | awk '$4==".dram0.bss" || $4==".dram0.data" {print strtonum("0x"$5), $4, substr($0, index($0,$6))}' | sort -rn | head -80
          echo "== totals by object file (bss+data)"
          grep -E '^ \.(bss|data|dram0)[^ ]* +0x3fc' .pio/build/${{ matrix.env }}/firmware.map 2>/dev/null | head -0 || true

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "(error|Error)[: ]" build.log | grep -v "^Compiling" | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done

      - name: Upload firmware
        if: success() && (startsWith(matrix.env, 'tlora_pager') || startsWith(matrix.env, 'LilyGo_TDeck_Max'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.env }}/firmware-merged.bin
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.elf
            .pio/build/${{ matrix.env }}/firmware.map
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.env }}-${{ github.sha }}
          path: build.log
